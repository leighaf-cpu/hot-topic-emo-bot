<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hot Topic — Text Us (If You Must)</title>
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #161616;
    --accent: #ff2d55;
    --text: #eaeaea;
    --muted: #8a8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #widget {
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 640px;
    background: var(--panel);
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    padding: 14px 16px;
    border-bottom: 1px solid #2a2a2a;
    font-weight: bold;
    letter-spacing: 1px;
    background: #000;
    color: var(--accent);
  }
  #header span {
    display: block;
    font-size: 11px;
    color: var(--muted);
    font-weight: normal;
    margin-top: 2px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 9px 12px;
    border-radius: 6px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #2a2a2a;
    color: var(--text);
  }
  .bot {
    align-self: flex-start;
    background: #000;
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }
  #inputRow {
    display: flex;
    border-top: 1px solid #2a2a2a;
    padding: 10px;
    gap: 8px;
  }
  #inputRow input {
    flex: 1;
    background: #000;
    border: 1px solid #2a2a2a;
    color: var(--text);
    padding: 10px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
  }
  #inputRow button {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 0 16px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  #inputRow button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #limitNotice {
    padding: 8px 16px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    display: none;
  }
</style>
</head>
<body>

<div id="widget">
  <div id="header">
    HOT TOPIC
    <span>text us. if you're brave enough.</span>
  </div>
  <div id="messages"></div>
  <div id="limitNotice">that's enough for today. the register's closed.</div>
  <div id="inputRow">
    <input id="input" type="text" placeholder="type something, i guess" maxlength="500" />
    <button id="send">send</button>
  </div>
</div>

<script>
  // --- Config ---
  const MAX_MESSAGES_PER_VISITOR = 20; // soft client-side cap per browser/day
  const STORAGE_KEY = 'httext_count_' + new Date().toDateString();

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendEl = document.getElementById('send');
  const limitEl = document.getElementById('limitNotice');

  let history = []; // {role, content} pairs sent to the API for context

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function getCount() {
    return parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
  }
  function incrementCount() {
    localStorage.setItem(STORAGE_KEY, String(getCount() + 1));
  }
  function checkLimit() {
    if (getCount() >= MAX_MESSAGES_PER_VISITOR) {
      inputEl.disabled = true;
      sendEl.disabled = true;
      limitEl.style.display = 'block';
      return true;
    }
    return false;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || checkLimit()) return;

    addMessage(text, 'user');
    inputEl.value = '';
    sendEl.disabled = true;

    const typingEl = addMessage('...typing, unfortunately', 'typing');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history })
      });
      const data = await res.json();

      typingEl.remove();
      const reply = data.reply || "...(silence. dramatic, right?)";
      addMessage(reply, 'bot');

      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: reply });
      history = history.slice(-10); // keep context small

      incrementCount();
      checkLimit();
    } catch (err) {
      typingEl.remove();
      addMessage("something broke. kind of fitting, actually.", 'bot');
    } finally {
      sendEl.disabled = false;
    }
  }

  sendEl.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  checkLimit();
  addMessage("what do you want.", 'bot');
</script>

</body>
</html>
